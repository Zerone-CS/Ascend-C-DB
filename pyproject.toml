[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-c-cookbook"
version = "0.1.0"
description = "Template-based Ascend C operator development cookbook"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
keywords = ["ascend", "npu", "operator", "kernel", "huawei"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
ascend-op = "tools.op_lookup:main"
ascend-query = "tools.query_db:main"

[project.urls]
Homepage = "https://github.com/your-org/ascend-c-cookbook"
Documentation = "https://github.com/your-org/ascend-c-cookbook/tree/main/docs"
Issues = "https://github.com/your-org/ascend-c-cookbook/issues"
