name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    
    - name: Test op_lookup tool
      run: |
        python tools/op_lookup.py softmax
        python tools/op_lookup.py list
    
    - name: Verify examples exist
      run: |
        test -f examples/01_unary_exp/exp_custom.cpp
        test -f examples/06_softmax/softmax_custom.cpp
        test -f templates/01_SOFTMAX_TEMPLATE.md
    
    - name: Check Markdown files
      run: |
        for f in templates/*.md; do
          echo "Checking $f"
          head -1 "$f"
        done

  syntax-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Check C++ syntax (basic)
      run: |
        # 检查关键定义是否存在
        for cpp in examples/*/*.cpp; do
          echo "Checking: $cpp"
          grep -q "#include" "$cpp" || echo "Warning: no #include in $cpp"
          grep -q "__aicore__" "$cpp" || echo "Warning: no __aicore__ in $cpp"
        done
